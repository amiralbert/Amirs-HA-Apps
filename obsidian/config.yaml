name: Obsidian
version: "0.1.9"
slug: obsidian
stage: experimental
description: Obsidian desktop in your browser, vault stored in /share/obsidian
url: https://github.com/amiralbert/Amirs-HA-Apps/tree/main/obsidian
image: ghcr.io/amiralbert/obsidian
arch:
  - aarch64
  - amd64
init: false
ports:
  3000/tcp: 3010
  3001/tcp: 3011
ports_description:
  3000/tcp: Obsidian web UI (HTTP, for reverse proxies)
  3001/tcp: Obsidian web UI (HTTPS)
webui: "https://[HOST]:[PORT:3011]"
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
  - type: ssl
options:
  username: admin
  password: yaq1yse4YAQ!YSE$
schema:
  username: str?
  password: password?
