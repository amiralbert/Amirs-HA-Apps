name: Builder

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.addons_list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

  build:
    name: Build ${{ matrix.app }}
    needs: find
    if: needs.find.outputs.apps != '[]'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.find.outputs.apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
