name: FreeLLMAPI
version: "0.1.0"
slug: freellmapi
description: Local OpenAI-compatible gateway that stacks the free tiers of many LLM providers
url: https://github.com/amiralbert/Amirs-HA-Apps/tree/main/freellmapi
image: ghcr.io/amiralbert/freellmapi
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: Dashboard and OpenAI-compatible API (/v1)
webui: "http://[HOST]:[PORT:3001]"
watchdog: "http://[HOST]:[PORT:3001]/api/ping"
options:
  encryption_key: ""
  response_cache: false
  compression: "off"
  dashboard_origins: ""
schema:
  encryption_key: password?
  response_cache: bool
  compression: list(off|lossless|standard|aggressive)
  dashboard_origins: str?
