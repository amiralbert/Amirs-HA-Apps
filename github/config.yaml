name: GitHub Sync
version: "0.1.5"
slug: github
description: Keeps GitHub repositories in /share in sync (pull, optional auto-commit and push)
url: https://github.com/amiralbert/Amirs-HA-Apps/tree/main/github
image: ghcr.io/amiralbert/github-sync
arch:
  - aarch64
  - amd64
init: false
map:
  - type: share
    read_only: false
options:
  github_token: ""
  git_username: ""
  git_email: ""
  sync_interval: 15
  repositories: []
schema:
  github_token: password?
  git_username: str?
  git_email: email?
  sync_interval: int(1,1440)
  repositories:
    - url: str
      path: str
      branch: str?
      push: bool?
