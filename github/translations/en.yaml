configuration:
  github_token:
    name: GitHub token
    description: Personal access token for HTTPS access to github.com.
  git_username:
    name: Git username
    description: GitHub user name, also used for commits.
  git_email:
    name: Git email
    description: Email address used for commits.
  sync_interval:
    name: Sync interval
    description: Minutes between sync runs.
  repositories:
    name: Repositories
    description: Repositories to keep in sync (path is relative to /share).
